<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada · Patitas Unidas</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2b2420" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="pagina-404">
    <!-- GitHub Pages sirve este archivo ante cualquier ruta inexistente. Las
         rutas van con barra inicial porque el 404 puede dispararse desde
         cualquier profundidad, por ejemplo /adopta/algo-que-no-existe. -->
    <main class="error-wrap">
      <img class="error-logo" src="/img/logo.webp" alt="" width="96" height="96" onerror="this.remove()" />

      <p class="eyebrow">Error 404</p>
      <h1>Esta página se escapó.</h1>
      <p class="lede">
        La dirección que buscas no existe o cambió de sitio. Prometemos que a los
        perros los encontramos con mejor puntería.
      </p>

      <div class="btn-row error-acciones">
        <a class="btn btn-primary" href="/">Volver al inicio</a>
        <a class="btn btn-ghost" href="/#adopta">Ver quién busca familia</a>
      </div>

      <p class="fine">
        ¿Necesitas algo puntual?
        <a href="mailto:fundacionpatitasunidaschile@gmail.com">fundacionpatitasunidaschile@gmail.com</a>
      </p>
    </main>
  </body>
</html>
